<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimension — Technical Document Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
    <script>
        (function() {
            try {
                var theme = localStorage.getItem('dimension_theme') || 'light';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <!-- Ambient Light Meshes (Dimension Atmosphere) -->
    <div class="dimension-ambient-mesh"></div>
    <div class="dimension-ambient-spotlight"></div>

    <div class="app-container">
        
        <!-- Floating Frosted Nav Header (Ultra-Minimal) -->
        <header class="chat-header">
            <div class="chat-header-info">
                <button id="sidebar-toggle-btn" class="header-sidebar-toggle-btn" title="Toggle Sidebar (⌘B)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="9" y1="3" x2="9" y2="21"></line>
                    </svg>
                </button>

                <div class="header-brand-group">
                    <div class="header-brand-icon">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                            <polyline points="2 17 12 22 22 17"></polyline>
                            <polyline points="2 12 12 17 22 12"></polyline>
                        </svg>
                    </div>
                    <span class="header-brand-name">Dimension</span>
                </div>
            </div>

            <!-- Header Controls: Focus Mode & Minimal Icon-Only Theme Switcher -->
            <div class="header-controls">
                <button id="focus-toggle-btn" class="header-icon-btn focus-toggle-btn" title="Toggle Focus Mode (Cmd+Shift+F)" aria-label="Toggle Focus Mode">
                    <!-- Viewfinder Focus Frame (Default) -->
                    <svg class="focus-icon-expand" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 7V4h3"></path>
                        <path d="M17 4h3v3"></path>
                        <path d="M20 17v3h-3"></path>
                        <path d="M7 20H4v-3"></path>
                        <circle cx="12" cy="12" r="2.5"></circle>
                    </svg>
                    <!-- Viewfinder Focus Frame (Active / Centered Target) -->
                    <svg class="focus-icon-shrink hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 8V3h5"></path>
                        <path d="M16 3h5v5"></path>
                        <path d="M21 16v5h-5"></path>
                        <path d="M8 21H3v-5"></path>
                        <circle cx="12" cy="12" r="3.5" fill="currentColor"></circle>
                    </svg>
                </button>
                <button id="theme-toggle-btn" class="theme-toggle-btn" title="Toggle Theme (Light / Dark)">
                    <span id="theme-icon">☀️</span>
                </button>
            </div>

            <!-- Hidden placeholders to maintain 100% JS API compatibility -->
            <span id="active-chat-title" style="display: none;"></span>
            <span id="active-model-badge" style="display: none;"></span>
            <button id="new-chat-btn" style="display: none;">New Chat</button>
        </header>

        <!-- Main Workspace: Floating Sidebar Rail + Chat Canvas -->
        <div class="workspace-body">
            
            <!-- Left Sidebar Rail: Floating Frosted Panel -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <div class="sidebar-brand-row">
                        <div class="sidebar-brand-badge">
                            <span class="dot pulse"></span>
                            <span>Connected Vault</span>
                        </div>
                        <button id="sidebar-collapse-btn" class="sidebar-toggle-btn" title="Collapse sidebar (Cmd+B)">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="9" y1="3" x2="9" y2="21"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Conversations Section (Multi-Chat) -->
                <div class="sessions-section">
                    <div class="section-header-row">
                        <span class="section-title">Threads (<span id="chat-count">0</span>)</span>
                        <button id="sidebar-new-chat-btn" class="icon-action-btn" title="Create New Thread (Cmd+K)">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            <span>New</span>
                        </button>
                    </div>
                    <div id="sessions-list" class="sessions-list">
                        <!-- Session rows injected dynamically -->
                    </div>
                </div>
                
                <!-- Upload Dropzone & Knowledge Inventory -->
                <div class="documents-section">
                    <div class="section-header-row">
                        <span class="section-title">Documents (<span id="doc-count">0</span>)</span>
                        <button id="clear-all-btn" class="clear-all-btn" title="Purge all indexed vectors">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            </svg>
                            <span>Purge</span>
                        </button>
                    </div>

                    <div class="upload-section">
                        <div id="drop-zone" class="drop-zone">
                            <div class="drop-zone-content">
                                <div class="drop-icon-container">
                                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                        <polyline points="17 8 12 3 7 8"></polyline>
                                        <line x1="12" y1="3" x2="12" y2="15"></line>
                                    </svg>
                                </div>
                                <p class="drop-prompt">Drop files or <span class="browse-text">connect vault</span></p>
                                <div class="format-tags">
                                    <span class="format-tag tag-pdf">PDF</span>
                                    <span class="format-tag tag-docx">DOCX</span>
                                    <span class="format-tag tag-txt">TXT</span>
                                    <span class="format-tag tag-md">MD</span>
                                </div>
                                <input type="file" id="file-input" accept=".pdf,.docx,.txt,.md" hidden>
                            </div>
                        </div>
                        <div id="upload-status" class="status-message hidden"></div>
                    </div>

                    <div id="documents-list" class="documents-list">
                        <div class="empty-docs-placeholder">No documents connected yet.</div>
                    </div>
                </div>
                
                <!-- System Telemetry Footer -->
                <div class="sidebar-footer">
                    <div class="status-indicator">
                        <span class="dot pulse"></span>
                        <span>Port 8001 &middot; ChromaDB</span>
                    </div>
                    <span class="version-badge">v2.6</span>
                </div>
            </aside>

            <!-- Main Conversation Area -->
            <main class="chat-area">
                <div id="chat-box" class="chat-box">
                    <!-- Welcome Hero State injected by default or session messages -->
                </div>

                <!-- Floating Frosted Command Prompt Dock with Bottom Selectors -->
                <div class="input-area">
                    <form id="chat-form">
                        <input type="text" id="query-input" placeholder="Ask anything across connected documents or search the web..." autocomplete="off" required>
                        <div class="input-controls">
                            <span id="key-hint" class="input-shortcut-hint" style="display: none;"></span>
                            <button type="submit" id="send-btn" class="send-btn" title="Send query (Enter)">
                                <span class="send-label">Send</span>
                                <svg class="send-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="22" y1="2" x2="11" y2="13"></line>
                                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                </svg>
                                <svg class="stop-icon hidden" width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                                    <rect x="4" y="4" width="16" height="16" rx="2"></rect>
                                </svg>
                            </button>
                        </div>
                    </form>

                    <!-- Bottom Accessory Bar: Model & Effort Selectors Near Text Entry -->
                    <div class="dock-accessory-bar">
                        <div class="dock-selectors">
                            <div class="selector-group" title="Select LLM Model">
                                <span class="selector-label">Model</span>
                                <select id="model-select" class="header-select">
                                    <option value="llama3">llama3</option>
                                </select>
                            </div>

                            <div class="selector-group" title="Select Reasoning Effort">
                                <span class="selector-label">Effort</span>
                                <select id="effort-select" class="header-select">
                                    <option value="low">Low (Fast)</option>
                                    <option value="medium" selected>Medium</option>
                                    <option value="high">Deep (High)</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </main>

        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
